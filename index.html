<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bar Restaurante Popina</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#102015;color:#fff}
header{padding:80px 20px;text-align:center;background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url("IMAGEN DE FONDO POPINA .jpeg");background-size:cover;background-position:center}
h1{font-size:48px;color:#d6b15d}
.btn{display:inline-block;margin:10px;padding:14px 22px;background:#d6b15d;color:#111;text-decoration:none;font-weight:bold;border-radius:6px}
section{padding:40px 20px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#1b3323;border-radius:12px;overflow:hidden}
.card img{width:100%;height:220px;object-fit:cover}
.card h3{padding:15px}
footer{padding:30px;text-align:center;background:#08110b}
</style>
</head>
<body>

<header>
<h1>Bar Restaurante Popina</h1>
<p>Plaza de los Alféreces 10, Badajoz</p>
<a class="btn" href="tel:619991176">Llamar</a>
<a class="btn" href="https://wa.me/34619991176?text=Hola,%20quiero%20hacer%20una%20reserva">Reservar por WhatsApp</a>
</header>

<section>
<h2>Nuestra carta</h2>
<div class="cards">
<div class="card"><img src="CACHOPO.jpeg"><h3>Cachopo</h3></div>
<div class="card"><img src="ENSALADA DE AHUMADOS.jpeg"><h3>Ensalada de ahumados</h3></div>
<div class="card"><img src="ENSALADILLA DE PULPO Y LANGOSTINO.jpeg"><h3>Ensaladilla de pulpo y langostino</h3></div>
</div>
</section>

<section>
<h2>Reservas</h2>
<p>Para reservar, pulsa el botón y completa el mensaje en WhatsApp.</p>
<a class="btn" href="https://wa.me/34619991176?text=Hola,%20quiero%20reservar.%0A%0ANombre:%20%0APersonas:%20%0AFecha:%20%0AHora:%20">Reservar ahora</a>
</section>

<footer>
<p>Popina · Badajoz</p>
</footer>

</body>
</html>
